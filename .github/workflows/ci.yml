name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest suites
        run: pytest apps/sut/backend suites/api libs/minipytest/tests -q
      - name: Run mini pytest acceptance demo
        run: python -m libs.minipytest libs/minipytest/demo/acceptance
